<!DOCTYPE html>
<html>

<head>
    <title>Animations with Custom Text Focus & Esc View</title>
    <style>
        body {
            margin: 0;
            overflow: hidden;
        }
    </style>
</head>

<body>
    <!-- core three.js -->
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/build/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/OBJLoader.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/GLTFLoader.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/RGBELoader.js"></script>

    <script>
        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.shadowMap.enabled = true;
        renderer.shadowMap.type = THREE.PCFSoftShadowMap;
        renderer.outputEncoding = THREE.sRGBEncoding; 
        renderer.toneMapping = THREE.ACESFilmicToneMapping;
        renderer.toneMappingExposure = 1.0;
        document.body.appendChild(renderer.domElement);

        const scene = new THREE.Scene();

        const camera = new THREE.PerspectiveCamera(
            75,
            window.innerWidth / window.innerHeight,
            0.1,
            1000
        );
        camera.position.set(0, 2, 5);
        camera.lookAt(0, 0, 0);
        
        const controls = new THREE.OrbitControls(camera, renderer.domElement);
        controls.enableDamping = true;

        // 1. กำหนดตำแหน่งกล้องและเป้าหมายตอนกดปุ่ม Esc (มุมมองภาพรวม)
        const initialCameraPos = new THREE.Vector3(0, 2, 9);       
        const initialControlsTarget = new THREE.Vector3(0, 0, 0);  

        const textZoomPadding = 1.15;
        const textViewElevation = 0.08;
        const textMeshNames = new Set(["title.glb", "text.glb", "about.glb", "myjob.glb"]);
        const aboutFocusTargetName = "about";
        const textFocusTargetName = "text";

        // ประกาศตัวแปรเสริมที่จำเป็นสำหรับฟังก์ชัน loadModel ด้านล่าง
        const animationMixers = [];
        const nonPickableNames = new Set();
        const pickables = [];
        let scene1 = null;

        const abmientLight = new THREE.AmbientLight(0xffffff, 1);
        scene.add(abmientLight);

        const directionalLight = new THREE.DirectionalLight(0xffffff, 1.5);
        directionalLight.position.set(10, 10, 10);
        directionalLight.castShadow = true;
        scene.add(directionalLight);

        const hdrUrl = 'https://dl.polyhaven.org/file/ph-assets/HDRIs/hdr/4k/limpopo_golf_course_4k.hdr';
        const pmremGenerator = new THREE.PMREMGenerator(renderer);
        pmremGenerator.compileEquirectangularShader();

        new THREE.RGBELoader()
            .load(hdrUrl, (texture) => {
                texture.mapping = THREE.EquirectangularReflectionMapping;

                const envMap = pmremGenerator.fromEquirectangular(texture).texture;

                scene.background = texture; 
                scene.environment = envMap; 

                pmremGenerator.dispose();
            }, undefined, (error) => {
                console.error('Unable to load HDR skybox:', error);
            });

        const raycaster = new THREE.Raycaster();
        const mouse = new THREE.Vector2();
        let loadedModel = null;
        const animationActions = {};

        let isFocusing = false;
        const targetCameraPos = new THREE.Vector3();
        const targetControlsTarget = new THREE.Vector3();
        let focusedMesh = null;

        const clock = new THREE.Clock();
        let mixer;
        const loader = new THREE.GLTFLoader();
        loader.load('https://pooh-holo47.github.io/pooh.ooo/model.glb', (gltf) => {
            const model = gltf.scene;
            loadedModel = model; 
            
            model.traverse((child) => {
                if (child.isMesh) {
                    child.castShadow = true;
                    child.receiveShadow = true;
                }
            });

            const box = new THREE.Box3().setFromObject(model);
            const size = box.getSize(new THREE.Vector3());
            const maxDim = Math.max(size.x, size.y, size.z);
            const targetSize = 10;
            const scale = targetSize / maxDim;
            model.scale.set(scale, scale, scale);

            box.setFromObject(model);
            const center = box.getCenter(new THREE.Vector3());
            model.position.x = -center.x;
            model.position.z = -center.z;
            model.position.y = -box.min.y;

            scene.add(model);

            mixer = new THREE.AnimationMixer(model);
            
            gltf.animations.forEach((clip) => {
                const action = mixer.clipAction(clip);
                animationActions[clip.name] = action;
                action.play(); 
            });
        });

        // ฟังก์ชันสั่งให้กล้องเคลื่อนไปเป้าหมาย
        function moveToTarget(camPos, targetPos) {
            targetCameraPos.copy(camPos);
            targetControlsTarget.copy(targetPos);
            isFocusing = true;
        }

        function focusOnMesh(mesh) {
            const bounds = new THREE.Box3().setFromObject(mesh);
            const sphere = bounds.getBoundingSphere(new THREE.Sphere());
            const verticalHalfFov = THREE.MathUtils.degToRad(camera.fov / 2);
            const horizontalHalfFov = Math.atan(Math.tan(verticalHalfFov) * camera.aspect);
            const limitingHalfFov = Math.min(verticalHalfFov, horizontalHalfFov);
            const distance = Math.max(sphere.radius, 0.1) / Math.sin(limitingHalfFov) * textZoomPadding;
            const cameraOffset = new THREE.Vector3(0, textViewElevation, 1).normalize().multiplyScalar(distance);

            moveToTarget(sphere.center.clone().add(cameraOffset), sphere.center);
        }

        const normalizeName = (s) => s.toLowerCase().replace(/\.glb$/, '').replace(/[.\s_]/g, '');

        function findObjectByName(root, name) {
            let match = null;
            root.traverse((object) => {
                if (!match && normalizeName(object.name) === normalizeName(name)) {
                    match = object;
                }
            });
            return match;
        }

        // คลิกตัวอักษรเพื่อซูมเข้าไปมอง
        window.addEventListener('pointerdown', (event) => {
            if (!loadedModel) return;

            mouse.x = (event.clientX / window.innerWidth) * 2 - 1;
            mouse.y = -(event.clientY / window.innerHeight) * 2 + 1;

            raycaster.setFromCamera(mouse, camera);
            const intersects = raycaster.intersectObject(loadedModel, true);

            if (intersects.length > 0) {
                const hitMesh = intersects[0].object;
                console.log("Clicked Mesh Name:", hitMesh.name); // เช็คชื่อ Mesh ใน Console (F12)[cite: 1]

                let clickedObject = hitMesh;
                while (clickedObject && clickedObject !== loadedModel) {
                    if (clickedObject.name.toLowerCase().includes(aboutFocusTargetName)) {
                        const target = findObjectByName(loadedModel, textFocusTargetName);
                        if (target) {
                            focusedMesh = target;
                            focusOnMesh(target);
                        } else {
                            console.warn(`Focus target not found: ${textFocusTargetName}`);
                        }
                        return;
                    }
                    clickedObject = clickedObject.parent;
                }

                const meshName = hitMesh.name.toLowerCase();
                if (meshName.includes("text") || textMeshNames.has(meshName)) {
                    focusedMesh = hitMesh;
                    focusOnMesh(hitMesh);
                }
            }
        });

        // ฟังก์ชันรีเซ็ตมุมมองไปตำแหน่งที่คุณกำหนดเอง (Esc)
        function resetView() {
            focusedMesh = null;
            moveToTarget(initialCameraPos, initialControlsTarget);
        }

        // รองรับการกดปุ่ม ESC บนคีย์บอร์ดเพื่อกลับไปยังตำแหน่งที่กำหนด
        window.addEventListener('keydown', (event) => {
            if (event.key === 'Escape') {
                resetView();
            }
        });

        // กดปุ่ม P เพื่อพิมพ์ค่ากล้องปัจจุบันออก Console
        window.addEventListener('keydown', (event) => {
            if (event.key.toLowerCase() === 'p') {
                const c = camera.position, t = controls.target;
                const f = (n) => +n.toFixed(2);
                console.log(`{ cam: [${f(c.x)}, ${f(c.y)}, ${f(c.z)}], target: [${f(t.x)}, ${f(t.y)}, ${f(t.z)}] }`);
            }
        });
      
        function animate(t) {
            const delta = clock.getDelta();
            if (mixer) mixer.update(delta);
            // อัปเดต mixer ของโมเดลอื่นๆ เพิ่มเติมด้วยถ้าต้องการ
            animationMixers.forEach((m) => m.update(delta));

            if (isFocusing) {
                camera.position.lerp(targetCameraPos, 0.08);
                controls.target.lerp(targetControlsTarget, 0.08);

                if (camera.position.distanceTo(targetCameraPos) < 0.01 && controls.target.distanceTo(targetControlsTarget) < 0.01) {
                    isFocusing = false;
                }
            }
            
            controls.update(); 
            renderer.render(scene, camera);
            requestAnimationFrame(animate);
        }
        animate(0);

        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
            if (focusedMesh) focusOnMesh(focusedMesh);
        });
    </script>
</body>

</html>
