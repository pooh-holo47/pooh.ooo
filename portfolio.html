<!DOCTYPE html>
<html>

<head>
    <title>Animations</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <style>
        body {
            margin: 0;
            overflow: hidden;
        }
    </style>
</head>

<body>
    <!-- core three.js -->
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/build/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/OBJLoader.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/GLTFLoader.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/RGBELoader.js"></script>

    <script>
        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.shadowMap.enabled = true;
        renderer.shadowMap.type = THREE.PCFSoftShadowMap;
        renderer.outputEncoding = THREE.sRGBEncoding; 
        renderer.toneMapping = THREE.ACESFilmicToneMapping;
        renderer.toneMappingExposure = 0.78;
        document.body.appendChild(renderer.domElement);

        const scene = new THREE.Scene();

        const camera = new THREE.PerspectiveCamera(
            70,
            window.innerWidth / window.innerHeight,
            0.1,
            1000
        );
        const defaultCameraUp = camera.up.clone();
        camera.position.set(0, 5, 12);
        camera.lookAt(0, 2.5, 0);
        
        const controls = new THREE.OrbitControls(camera, renderer.domElement);
        controls.enableDamping = true;

        // 1. กำหนดตำแหน่งกล้องและเป้าหมายตอนกดปุ่ม Esc (มุมมองภาพรวม)
        const initialCameraPos = new THREE.Vector3(0, 5, 12);
        const initialControlsTarget = new THREE.Vector3(0, 2.5, 0);
        controls.target.copy(initialControlsTarget);

        const textZoomPadding = 1.15;
        const sphereZoomPadding = 1.75;
        const sphereViewElevation = 0.22;
        const textViewElevation = 0.08;
        const textMeshNames = new Set(["title.glb", "text.glb", "about.glb", "myjob.glb"]);
        const Text003FocusTargetName = "text003";
        const Text002FocusTargetName = "text002";
        const Text005FocusTargetName = "text005";
        const Text007FocusTargetName = "text007";
        const Text004FocusTargetName = "text004";
        const PaintFocusTargetName = "paint";
        const SphereFocusTargetName = "Sphere";
        const toonTreeMeshNames = new Set(["cylinder", "cylinder001", "cylinder002", "sphere005"]);
        const toonCowMeshNames = new Set(["plane007", "plane008", "plane009", "plane010", "cube001"]);
        const guiFocusTargetName = "gui";
        const thanosFocusTargetName = "thanos";

        // ประกาศตัวแปรเสริมที่จำเป็นสำหรับฟังก์ชัน loadModel ด้านล่าง
        const animationMixers = [];
        const nonPickableNames = new Set();
        const pickables = [];
        let scene1 = null;

        const abmientLight = new THREE.AmbientLight(0xffffff, 0.35);
        scene.add(abmientLight);

        const directionalLight = new THREE.DirectionalLight(0xffffff, 0.95);
        directionalLight.position.set(10, 10, 10);
        directionalLight.castShadow = true;
        directionalLight.shadow.mapSize.set(1024, 1024);
        directionalLight.shadow.camera.left = -10;
        directionalLight.shadow.camera.right = 10;
        directionalLight.shadow.camera.top = 12;
        directionalLight.shadow.camera.bottom = -2;
        directionalLight.shadow.camera.near = 0.5;
        directionalLight.shadow.camera.far = 40;
        directionalLight.shadow.camera.updateProjectionMatrix();
        directionalLight.shadow.bias = -0.0003;
        directionalLight.shadow.normalBias = 0.025;
        directionalLight.shadow.radius = 3;
        scene.add(directionalLight);

        const hdrUrl = 'https://dl.polyhaven.org/file/ph-assets/HDRIs/hdr/4k/limpopo_golf_course_4k.hdr';
        const pmremGenerator = new THREE.PMREMGenerator(renderer);
        pmremGenerator.compileEquirectangularShader();

        new THREE.RGBELoader()
            .load(hdrUrl, (texture) => {
                texture.mapping = THREE.EquirectangularReflectionMapping;

                const envMap = pmremGenerator.fromEquirectangular(texture).texture;

                scene.background = texture; 
                scene.environment = envMap; 

                pmremGenerator.dispose();
            }, undefined, (error) => {
                console.error('Unable to load HDR skybox:', error);
            });

        const raycaster = new THREE.Raycaster();
        const mouse = new THREE.Vector2();
        let loadedModel = null;
        const animationActions = {};
        const sphereWaveUniforms = [];
        const toonLightUniforms = [];
        const toonLightWorldDirection = new THREE.Vector3(0.4, 1.0, 0.8).normalize();

        let isFocusing = false;
        const targetCameraPos = new THREE.Vector3();
        const targetControlsTarget = new THREE.Vector3();
        let focusedMesh = null;
        let followFocusedMeshAnimation = false;
        const cameraFollowBounds = new THREE.Box3();
        const cameraFollowCenter = new THREE.Vector3();
        const cameraFollowPreviousCenter = new THREE.Vector3();
        const cameraFollowDelta = new THREE.Vector3();

        const clock = new THREE.Clock();
        let mixer;
        const loader = new THREE.GLTFLoader();
        loader.load('https://pooh-holo47.github.io/pooh.ooo/model.glb', (gltf) => {
            const model = gltf.scene;
            loadedModel = model; 
            
            const modelMeshes = [];
            model.traverse((child) => {
                if (child.isMesh) {
                    modelMeshes.push(child);
                    child.castShadow = true;
                    child.receiveShadow = true;

                    if (["text", "text001"].includes(normalizeName(child.name))) {
                        const vertices = new THREE.Points(
                            child.geometry,
                            new THREE.PointsMaterial({ color: 0xff3333, size: 0.025 })
                        );
                        vertices.raycast = () => {};
                        child.add(vertices);
                    }
                }
            });

            modelMeshes.forEach((child) => {
                let isSphereMesh = false;
                let ancestor = child;
                while (ancestor && ancestor !== model) {
                    if (normalizeName(ancestor.name).includes(normalizeName(SphereFocusTargetName))) {
                        isSphereMesh = true;
                        break;
                    }
                    ancestor = ancestor.parent;
                }

                const meshName = normalizeName(child.name);
                const toonStyle = toonTreeMeshNames.has(meshName)
                    ? "tree"
                    : toonCowMeshNames.has(meshName) ? "cow" : "default";
                applyToonShader(child, isSphereMesh, toonStyle);
            });

            const box = new THREE.Box3().setFromObject(model);
            const size = box.getSize(new THREE.Vector3());
            const maxDim = Math.max(size.x, size.y, size.z);
            const targetSize = 10;
            const scale = targetSize / maxDim;
            model.scale.set(scale, scale, scale);

            box.setFromObject(model);
            const center = box.getCenter(new THREE.Vector3());
            model.position.x = -center.x;
            model.position.z = -center.z;
            model.position.y = -box.min.y;

            scene.add(model);

            mixer = new THREE.AnimationMixer(model);
            
            gltf.animations.forEach((clip) => {
                const action = mixer.clipAction(clip);
                animationActions[clip.name] = action;
                action.play(); 
            });
        });

        // ฟังก์ชันสั่งให้กล้องเคลื่อนไปเป้าหมาย
        function moveToTarget(camPos, targetPos) {
            targetCameraPos.copy(camPos);
            targetControlsTarget.copy(targetPos);
            isFocusing = true;
        }

        function focusOnMesh(mesh, viewSide = 1, alignToText = false, followAnimation = false) {
            const bounds = new THREE.Box3().setFromObject(mesh);
            const sphere = bounds.getBoundingSphere(new THREE.Sphere());
            const verticalHalfFov = THREE.MathUtils.degToRad(camera.fov / 2);
            const horizontalHalfFov = Math.atan(Math.tan(verticalHalfFov) * camera.aspect);
            const limitingHalfFov = Math.min(verticalHalfFov, horizontalHalfFov);
            const zoomPadding = followAnimation ? sphereZoomPadding : textZoomPadding;
            const distance = Math.max(sphere.radius, 0.1) / Math.sin(limitingHalfFov) * zoomPadding;
            let cameraOffset;

            if (alignToText) {
                const worldQuaternion = mesh.getWorldQuaternion(new THREE.Quaternion());
                const textUp = new THREE.Vector3(0, 1, 0).applyQuaternion(worldQuaternion).normalize();
                const textNormal = new THREE.Vector3(0, 0, viewSide).applyQuaternion(worldQuaternion).normalize();
                camera.up.copy(textUp);
                cameraOffset = textNormal.multiplyScalar(distance);
            } else {
                camera.up.copy(defaultCameraUp);
                const viewElevation = followAnimation ? sphereViewElevation : textViewElevation;
                cameraOffset = new THREE.Vector3(0, viewElevation, viewSide).normalize().multiplyScalar(distance);
            }

            moveToTarget(sphere.center.clone().add(cameraOffset), sphere.center);
            followFocusedMeshAnimation = followAnimation;
            if (followAnimation) cameraFollowPreviousCenter.copy(sphere.center);
        }

        const normalizeName = (s) => s.toLowerCase().replace(/\.glb$/, '').replace(/[.\s_]/g, '');

        function applyToonShader(mesh, enableWave, toonStyle) {
            const toonSettings = toonStyle === "tree"
                ? { levels: 4, ambient: 0.28, direct: 1.2, edgeWidth: 0.1 }
                : toonStyle === "cow"
                    ? { levels: 2, ambient: 0.35, direct: 1.1, edgeWidth: 0.16 }
                    : { levels: 4, ambient: 0.45, direct: 0.9, edgeWidth: 0.12 };

            const applyToMaterial = (material) => {
                const toonMaterial = material.clone();
                if ("envMapIntensity" in toonMaterial) toonMaterial.envMapIntensity *= 0.45;
                const lightUniform = { value: new THREE.Vector3() };
                const styleUniforms = {
                    uToonLevels: { value: toonSettings.levels },
                    uToonAmbient: { value: toonSettings.ambient },
                    uToonDirect: { value: toonSettings.direct },
                    uToonEdgeWidth: { value: toonSettings.edgeWidth }
                };
                toonLightUniforms.push(lightUniform);
                let timeUniform;
                const previousOnBeforeCompile = toonMaterial.onBeforeCompile;

                toonMaterial.onBeforeCompile = (shader, activeRenderer) => {
                    if (previousOnBeforeCompile) previousOnBeforeCompile(shader, activeRenderer);
                    shader.uniforms.uToonLightDir = lightUniform;
                    Object.assign(shader.uniforms, styleUniforms);
                    shader.vertexShader = shader.vertexShader.replace(
                        '#include <common>',
                        '#include <common>\nvarying vec3 vToonNormal;\nvarying vec3 vToonViewDir;'
                    );
                    shader.vertexShader = shader.vertexShader.replace(
                        '#include <defaultnormal_vertex>',
                        '#include <defaultnormal_vertex>\nvToonNormal = normalize(transformedNormal);'
                    );
                    shader.vertexShader = shader.vertexShader.replace(
                        '#include <project_vertex>',
                        '#include <project_vertex>\nvToonViewDir = -mvPosition.xyz;'
                    );

                    if (enableWave) {
                        timeUniform = { value: 0 };
                        sphereWaveUniforms.push(timeUniform);
                        shader.uniforms.uTime = timeUniform;
                        shader.vertexShader = shader.vertexShader.replace(
                            '#include <common>',
                            '#include <common>\nuniform float uTime;'
                        );
                        shader.vertexShader = shader.vertexShader.replace(
                            '#include <beginnormal_vertex>',
                            `#include <beginnormal_vertex>
                            vec3 waveOriginalNormal = objectNormal;
                            float waveSlope = 0.6 * cos(position.x * 5.0 + uTime * 4.0);
                            objectNormal = normalize(objectNormal - vec3(waveSlope * waveOriginalNormal.y, 0.0, 0.0));`
                        );
                        shader.vertexShader = shader.vertexShader.replace(
                            '#include <begin_vertex>',
                            `#include <begin_vertex>
                            transformed.y += sin(position.x * 5.0 + uTime * 4.0) * 0.12;`
                        );
                    }

                    shader.fragmentShader = shader.fragmentShader.replace(
                        '#include <common>',
                        '#include <common>\nuniform vec3 uToonLightDir;\nuniform float uToonLevels;\nuniform float uToonAmbient;\nuniform float uToonDirect;\nuniform float uToonEdgeWidth;\nvarying vec3 vToonNormal;\nvarying vec3 vToonViewDir;'
                    );
                    shader.fragmentShader = shader.fragmentShader.replace(
                        'gl_FragColor = vec4( outgoingLight, diffuseColor.a );',
                        `vec3 toonNormal = normalize(vToonNormal);
                        if (!gl_FrontFacing) toonNormal = -toonNormal;
                        float toonDiffuse = max(dot(toonNormal, normalize(uToonLightDir)), 0.0);
                        toonDiffuse = floor(toonDiffuse * uToonLevels) / uToonLevels;
                        float toonEdge = smoothstep(0.0, uToonEdgeWidth, dot(toonNormal, normalize(vToonViewDir)));
                        vec3 toonColor = outgoingLight * (uToonAmbient + toonDiffuse * uToonDirect);
                        gl_FragColor = vec4(mix(vec3(0.0), toonColor, toonEdge), diffuseColor.a);
                        `
                    );
                };
                const previousProgramCacheKey = toonMaterial.customProgramCacheKey();
                toonMaterial.customProgramCacheKey = () => `${previousProgramCacheKey}|toon:${toonStyle}|wave:${enableWave}`;
                toonMaterial.needsUpdate = true;
                return toonMaterial;
            };

            mesh.material = Array.isArray(mesh.material)
                ? mesh.material.map(applyToMaterial)
                : applyToMaterial(mesh.material);
        }

        function findObjectByName(root, name) {
            let match = null;
            root.traverse((object) => {
                if (!match && normalizeName(object.name) === normalizeName(name)) {
                    match = object;
                }
            });
            return match;
        }

        // คลิกตัวอักษรเพื่อซูมเข้าไปมอง
        window.addEventListener('pointerdown', (event) => {
            if (!loadedModel) return;

            mouse.x = (event.clientX / window.innerWidth) * 2 - 1;
            mouse.y = -(event.clientY / window.innerHeight) * 2 + 1;

            raycaster.setFromCamera(mouse, camera);
            const intersects = raycaster.intersectObject(loadedModel, true);

            if (intersects.length > 0) {
                const hitMesh = intersects[0].object;
                console.log("Clicked Mesh Name:", hitMesh.name); // เช็คชื่อ Mesh ใน Console (F12)[cite: 1]

                let clickedObject = hitMesh;
                while (clickedObject && clickedObject !== loadedModel) {
                    if (normalizeName(clickedObject.name).includes(normalizeName(Text003FocusTargetName))) {
                        const target = findObjectByName(loadedModel, Text002FocusTargetName);
                        if (target) {
                            focusedMesh = target;
                            focusOnMesh(target);
                        } else {
                            console.warn(`Focus target not found: ${Text003FocusTargetName}`);
                        }
                        return;
                    }
                    if (normalizeName(clickedObject.name).includes(normalizeName(Text005FocusTargetName))) {
                        const target = findObjectByName(loadedModel, Text007FocusTargetName);
                        if (target) {
                            focusedMesh = target;
                            focusOnMesh(target, -1);
                        } else {
                            console.warn(`Focus target not found: ${Text007FocusTargetName}`);
                        }
                        return;
                    }
                    if (normalizeName(clickedObject.name).includes(normalizeName(Text004FocusTargetName))) {
                        const target = findObjectByName(loadedModel, PaintFocusTargetName);
                        if (target) {
                            focusedMesh = target;
                            focusOnMesh(target, -1);
                        } else {
                            console.warn(`Focus target not found: ${PaintFocusTargetName}`);
                        }
                        return;
                    }
                    if (normalizeName(clickedObject.name).includes(normalizeName(PaintFocusTargetName))) {
                        window.location.assign("https://pooh-holo47.github.io/pooh.ooo/paint.html");
                        return;
                    }
                    if (normalizeName(clickedObject.name).includes(normalizeName(guiFocusTargetName))) {
                        window.location.assign("https://pooh-holo47.github.io/pooh.ooo/gui.html");
                        return;
                    }
                    if (normalizeName(clickedObject.name).includes(normalizeName(thanosFocusTargetName))) {
                        window.location.assign("https://pooh-holo47.github.io/pooh.ooo/ThanosisMy.html");
                        return;
                    }
                    if (normalizeName(clickedObject.name).includes(normalizeName(SphereFocusTargetName))) {
                        focusedMesh = clickedObject;
                        focusOnMesh(clickedObject, 1, false, true);
                        return;
                    }
                    clickedObject = clickedObject.parent;
                }

                const meshName = hitMesh.name.toLowerCase();
                if (meshName.includes("text") || textMeshNames.has(meshName)) {
                    focusedMesh = hitMesh;
                    focusOnMesh(hitMesh);
                }
            }
        });

        // ฟังก์ชันรีเซ็ตมุมมองไปตำแหน่งที่คุณกำหนดเอง (Esc)
        function resetView() {
            focusedMesh = null;
            followFocusedMeshAnimation = false;
            camera.up.copy(defaultCameraUp);
            moveToTarget(initialCameraPos, initialControlsTarget);
        }

        // รองรับการกดปุ่ม ESC บนคีย์บอร์ดเพื่อกลับไปยังตำแหน่งที่กำหนด
        window.addEventListener('keydown', (event) => {
            if (event.key === 'Escape') {
                resetView();
            }
        });

        // กดปุ่ม P เพื่อพิมพ์ค่ากล้องปัจจุบันออก Console
        window.addEventListener('keydown', (event) => {
            if (event.key.toLowerCase() === 'p') {
                const c = camera.position, t = controls.target;
                const f = (n) => +n.toFixed(2);
                console.log(`{ cam: [${f(c.x)}, ${f(c.y)}, ${f(c.z)}], target: [${f(t.x)}, ${f(t.y)}, ${f(t.z)}] }`);
            }
        });
      
        function animate(t) {
            const delta = clock.getDelta();
            sphereWaveUniforms.forEach((uniform) => uniform.value = clock.elapsedTime);
            camera.updateMatrixWorld();
            const toonLightViewDirection = toonLightWorldDirection.clone().transformDirection(camera.matrixWorldInverse);
            toonLightUniforms.forEach((uniform) => uniform.value.copy(toonLightViewDirection));
            if (mixer) mixer.update(delta);
            // อัปเดต mixer ของโมเดลอื่นๆ เพิ่มเติมด้วยถ้าต้องการ
            animationMixers.forEach((m) => m.update(delta));

            if (followFocusedMeshAnimation && focusedMesh) {
                cameraFollowBounds.setFromObject(focusedMesh);
                cameraFollowBounds.getCenter(cameraFollowCenter);
                cameraFollowDelta.subVectors(cameraFollowCenter, cameraFollowPreviousCenter);

                if (isFocusing) {
                    targetControlsTarget.add(cameraFollowDelta);
                    targetCameraPos.add(cameraFollowDelta);
                } else {
                    camera.position.add(cameraFollowDelta);
                    controls.target.add(cameraFollowDelta);
                    targetControlsTarget.add(cameraFollowDelta);
                    targetCameraPos.add(cameraFollowDelta);
                }

                cameraFollowPreviousCenter.copy(cameraFollowCenter);
            }

            if (isFocusing) {
                const focusLerp = followFocusedMeshAnimation ? 0.18 : 0.08;
                camera.position.lerp(targetCameraPos, focusLerp);
                controls.target.lerp(targetControlsTarget, focusLerp);

                if (camera.position.distanceTo(targetCameraPos) < 0.01 && controls.target.distanceTo(targetControlsTarget) < 0.01) {
                    isFocusing = false;
                }
            }
            
            controls.update(); 
            renderer.render(scene, camera);
            requestAnimationFrame(animate);
        }
        animate(0);

        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
            if (focusedMesh) {
                const useBackView = [Text007FocusTargetName, PaintFocusTargetName]
                    .some((name) => normalizeName(focusedMesh.name).includes(normalizeName(name)));
                focusOnMesh(focusedMesh, useBackView ? -1 : 1, false, followFocusedMeshAnimation);
            }
        });
    </script>
</body>

</html>
