<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Shader Starter • three.js r128</title>
  <style>
    html, body { height: 100%; margin: 0; }
    canvas { display: block; }
  </style>
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/build/three.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/GLTFLoader.js"></script>
</head>
<body>
<script>
  // Scene / Camera / Renderer
  const scene = new THREE.Scene();
  scene.background = new THREE.Color(0xFFFFFF);

  const camera = new THREE.PerspectiveCamera(
    30,
    innerWidth / innerHeight,
    0.1,
    100
  );
  camera.position.set(3, 1, 0);

  const renderer = new THREE.WebGLRenderer({ antialias: true });
  renderer.setSize(innerWidth, innerHeight);
  renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
  document.body.appendChild(renderer.domElement);

  const controls = new THREE.OrbitControls(camera, renderer.domElement);
  const textureLoader =
    new THREE.TextureLoader();


  // =========================
  // เพิ่มแสงให้ Model
  // =========================

  const ambientLight = new THREE.AmbientLight(
    0xffffff,
    3
  );

  scene.add(ambientLight);


  const light = new THREE.HemisphereLight(
    0xffffff,
    0xffffff,
    3
  );

  scene.add(light);


  const frontLight = new THREE.DirectionalLight(
    0xffffff,
    4
  );

  frontLight.position.set(2, 3, 5);
  scene.add(frontLight);


  const backLight = new THREE.DirectionalLight(
    0xffffff,
    2
  );

  backLight.position.set(-3, 2, -4);
  scene.add(backLight);


  const topLight = new THREE.DirectionalLight(
    0xffffff,
    3
  );

  topLight.position.set(0, 6, 0);
  scene.add(topLight);


  // =========================
  // Load Model
  // =========================

  const loader = new THREE.GLTFLoader();

  loader.load(
    'https://pooh-holo47.github.io/pooh.ooo/model.glb',

    function (gltf) {
      const model = gltf.scene;

      scene.add(model);

      // เปลี่ยนบ้านเป็นสีเทา
      model.traverse(function (child) {
        if (child.isMesh) {
          child.material.color.set(0x888888);

          // เพิ่มความสว่างของ material
          child.material.emissive.set(0x222222);
          child.material.emissiveIntensity = 0.3;

        }
      });

      // -------------------------
      // Auto-center + auto-scale
      // -------------------------
      const box = new THREE.Box3().setFromObject(model);
      const center = box.getCenter(new THREE.Vector3());
      const size = box.getSize(new THREE.Vector3());

      model.position.sub(center);

      const maxSize = Math.max(
        size.x,
        size.y,
        size.z
      );

      const scale = 1.5 / maxSize;

      model.scale.setScalar(scale);

      console.log('Model loaded:', model);
    }
  );


  addEventListener('resize', () => {
    camera.aspect = innerWidth / innerHeight;
    camera.updateProjectionMatrix();
    renderer.setSize(innerWidth, innerHeight);
    renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
  });

  function animate() {

    controls.update();
    renderer.render(scene, camera);
    requestAnimationFrame(animate);
  }

  requestAnimationFrame(animate);
</script>
</body>
</html>
